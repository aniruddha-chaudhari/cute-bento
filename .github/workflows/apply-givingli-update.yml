name: Apply Givingli update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct updated page
        shell: bash
        run: |
          cat .update/givingli.part*.b64 | base64 --decode > givingli-bento.html
          cp givingli-bento.html index.html
      - name: Commit updated page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add givingli-bento.html index.html
          if git diff --cached --quiet; then
            echo "No page changes to commit."
            exit 0
          fi
          git commit -m "feat: apply updated Givingli bento"
          git push
