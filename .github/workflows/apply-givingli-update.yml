name: Apply Givingli update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct updated page
        shell: bash
        run: |
          cat \
            .update/givingli.part1.b64 \
            .update/givingli.part2.b64 \
            .update/givingli.part3.b64 \
            .update/givingli.part4a.b64 \
            .update/givingli.part4b.b64 \
            .update/givingli.part5.b64 \
            .update/givingli.part6.b64 > /tmp/givingli.b64
          base64 --decode /tmp/givingli.b64 > givingli-bento.html
          echo "64cabc7b67cad73df0b7f7d59fbf78f9860c51f6f06bb6c29fd75d27f48d2bc0  givingli-bento.html" | sha256sum -c -
          cp givingli-bento.html index.html
      - name: Commit updated page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add givingli-bento.html index.html
          if git diff --cached --quiet; then
            echo "No page changes to commit."
            exit 0
          fi
          git commit -m "feat: apply updated Givingli bento"
          git push
